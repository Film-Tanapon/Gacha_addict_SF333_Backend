<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gacha Addict · Admin</title>
<style>
:root{font-family:system-ui,sans-serif;color:#202640;background:#f4f6fb;--accent:#6454dc}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #dce0ed;background:white;border-radius:10px;padding:10px 15px;color:inherit}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}.primary{background:var(--accent);color:white;border-color:var(--accent)}.danger{color:#bc354d}.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:#20213d;color:white;padding:28px 18px}h1{font-size:23px;margin:0 0 8px}aside small{color:#aca9d0}nav{margin-top:32px;display:grid;gap:6px}nav button{text-align:left;background:transparent;border:0;color:#cccde2}nav button.active{background:#6454dc;color:white}main{padding:36px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}h2{margin:0 0 8px;font-size:28px}.muted{color:#737a91;font-size:14px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}.stat,.panel,.product{background:white;border:1px solid #e4e7f1;border-radius:16px;padding:22px}.stat strong{display:block;font-size:32px;margin-top:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.toolbar input{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}.preview{height:190px;display:grid;place-items:center;border-radius:12px;background:#f4f5fb;margin-bottom:18px}
.avatar{position:relative;display:grid;place-items:center;border:5px solid;border-radius:50%;width:98px;height:98px;font-size:32px}
.avatar.has-image{border:0;background:#e6eaf3}
.avatar-placeholder{color:#737a91;font-size:36px;line-height:1}
.avatar img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:164px;height:164px;max-width:none;object-fit:contain;pointer-events:none}
#imagePreview .preview{margin-bottom:12px}.product h3{margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:14px;border-bottom:1px solid #edf0f6;vertical-align:top;max-width:350px;overflow-wrap:anywhere}th{color:#737a91}td pre{white-space:pre-wrap;max-height:180px;overflow:auto;margin:0}.pager{display:flex;align-items:center;justify-content:space-between;margin-top:20px}input,select{padding:11px;border:1px solid #dce0ed;border-radius:9px;background:white;width:100%}label{display:grid;gap:7px;margin-bottom:16px;font-size:14px}dialog{border:0;border-radius:18px;width:min(530px,94vw);padding:28px;max-height:92vh;overflow:auto;box-shadow:0 20px 80px #20213d40}dialog::backdrop{background:#20213d99}.dialogtop{display:flex;justify-content:space-between;align-items:center}.dialogtop h2{font-size:22px}#notice{position:fixed;bottom:24px;right:24px;max-width:80vw;background:#20213d;color:white;padding:16px 22px;border-radius:12px;z-index:10}#notice:empty{display:none}#login{max-width:460px;margin:12vh auto}.empty{padding:45px;text-align:center;color:#737a91}[hidden]{display:none!important}@media(max-width:750px){.layout{grid-template-columns:1fr}aside{padding:20px}nav{display:flex;overflow:auto;margin-top:15px}nav button{white-space:nowrap}main{padding:20px}.top{align-items:flex-start;flex-wrap:wrap}}
</style></head><body>
<section id="login" class="panel"><h1>Gacha Addict</h1><h2>Admin console</h2><p class="muted">จัดการร้านค้าและตรวจสอบข้อมูลระบบ</p><form id="loginForm"><label>Backend URL<input id="base" type="url" required></label><label>Admin API key<input id="key" type="password" required autocomplete="off"></label><p class="muted">ใช้ค่า ADMIN_API_KEY จากการตั้งค่า server</p><button class="primary" id="connect">เข้าสู่ระบบ</button><p id="loginError" role="alert"></p></form></section>
<div id="app" class="layout" hidden><aside><h1>Gacha Addict</h1><small>ADMINISTRATION</small><nav id="nav"></nav><p class="muted" style="color:#aca9d0">ข้อมูลจาก backend จริง</p></aside><main><header class="top"><div><h2 id="title"></h2><span class="muted" id="subtitle"></span></div><div class="actions"><button id="refresh">รีเฟรช</button><button id="logout">ออกจากระบบ</button></div></header><section id="content" aria-live="polite"></section></main></div>
<dialog id="editor"><div class="dialogtop"><h2 id="editTitle"></h2><button id="closeEditor" type="button">ปิด</button></div><form id="editForm"><label>ID<input name="id" required pattern="[a-zA-Z0-9_-]{1,100}"></label><label>ชื่อสินค้า<input name="name" required maxlength="200"></label><label>ราคา (coins)<input name="price" type="number" min="0" max="2147483647" step="1" required></label><label>สี<input name="color" type="color"></label><div id="frameFields"><label>Decoration / emoji<input name="decoration"></label><label>อัปโหลดรูป frame (PNG / JPEG / WebP, สูงสุด 5 MB)<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><p class="muted">รูปเก็บบน server เป็น WebP รองรับพื้นหลังโปร่งใส</p><div id="imagePreview"></div><button id="removeImage" type="button">นำรูปออกจากสินค้า</button></div><p id="formError" role="alert" class="danger"></p><button id="save" class="primary">บันทึกสินค้า</button></form></dialog><div id="notice" role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={overview:'ภาพรวม',frames:'ร้านค้า · Frames',themes:'ร้านค้า · Themes',users:'ผู้ใช้งาน',cards:'กาชา',items:'รายการกาชา',results:'ประวัติการสุ่ม',missions:'ภารกิจ',favorites:'รายการโปรด',userFrames:'Frame ที่ผู้ใช้ถือครอง',userThemes:'Theme ที่ผู้ใช้ถือครอง',userMissions:'ความคืบหน้าภารกิจ',backups:'ข้อมูลสำรอง',syncedPulls:'รายการซิงค์'};
let base='',key='',view='overview',skip=0,rows=[],total=0,editing=null,imageUrl=null,requestVersion=0;
$('#base').value=localStorage.getItem('adminBase')||(location.protocol.startsWith('http')?location.origin:'http://localhost:3000');
async function api(path,{method='GET',body}={}){const multipart=body instanceof FormData;const r=await fetch(base+path,{method,headers:{'X-Admin-Key':key,...(body&&!multipart?{'Content-Type':'application/json'}:{})},body:body?(multipart?body:JSON.stringify(body)):undefined});if(!r.ok){const e=await r.json().catch(()=>({error:'HTTP '+r.status}));throw Error(e.error||'HTTP '+r.status)}return r.status===204?null:r.json()}
function notice(s){$('#notice').textContent=s;clearTimeout(notice.timer);notice.timer=setTimeout(()=>$('#notice').textContent='',4500)}
function asset(url){return /^\/api\/uploads\/[a-f\d-]+\.webp$/.test(url||'')?base+url:''}
$('#loginForm').onsubmit=async e=>{e.preventDefault();base=$('#base').value.replace(/\/+$/,'');key=$('#key').value;$('#connect').disabled=true;$('#loginError').textContent='';try{await api('/api/admin/summary');localStorage.setItem('adminBase',base);$('#login').hidden=true;$('#app').hidden=false;$('#key').value='';await load()}catch(e){$('#loginError').textContent=e.message}finally{$('#connect').disabled=false}};
$('#logout').onclick=()=>{key='';requestVersion++;$('#app').hidden=true;$('#login').hidden=false;$('#content').replaceChildren();$('#editor').close()};
$('#nav').innerHTML=Object.entries(labels).map(([id,label])=>`<button data-view="${id}">${esc(label)}</button>`).join('');
$('#nav').onclick=e=>{const b=e.target.closest('[data-view]');if(b){view=b.dataset.view;skip=0;load()}};$('#refresh').onclick=()=>load();
async function load(){const version=++requestVersion;$('#title').textContent=labels[view];$('#subtitle').textContent=base;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#content').innerHTML='<div class="empty">กำลังโหลดข้อมูล…</div>';try{if(view==='overview'){const stats=await api('/api/admin/summary');if(version!==requestVersion)return;$('#content').innerHTML='<div class="stats">'+Object.entries(stats).map(([name,count])=>`<button class="stat" data-go="${name}"><span class="muted">${esc(labels[name])}</span><strong>${count.toLocaleString()}</strong></button>`).join('')+'</div>';$('#content').onclick=e=>{const b=e.target.closest('[data-go]');if(b){view=b.dataset.go;skip=0;load()}};return}const data=await api(`/api/admin/data/${view}?skip=${skip}&take=50`);if(version!==requestVersion)return;rows=data.rows;total=data.total;render()}catch(e){if(version===requestVersion){$('#content').innerHTML=`<div class="panel danger">${esc(e.message)}</div>`}}}
function render(){const shop=['frames','themes'].includes(view);$('#content').onclick=null;$('#content').innerHTML=`<div class="toolbar"><input id="search" placeholder="ค้นหาในหน้านี้" aria-label="ค้นหาในหน้านี้">${shop?'<button id="add" class="primary">+ เพิ่มสินค้า</button>':''}<button id="export">ส่งออก JSON (ทุกหน้า)</button></div><div id="records"></div><div class="pager"><span>${total?skip+1:0}–${Math.min(skip+50,total)} จาก ${total.toLocaleString()}</span><div><button id="prev" ${skip===0?'disabled':''}>ก่อนหน้า</button> <button id="next" ${skip+50>=total?'disabled':''}>ถัดไป</button></div></div>`;$('#search').oninput=draw;$('#prev').onclick=()=>{skip=Math.max(0,skip-50);load()};$('#next').onclick=()=>{skip+=50;load()};if(shop)$('#add').onclick=()=>openEditor(null);$('#export').onclick=exportAll;draw()}
// These 200px frame assets have an approximately 120px inner circle.
// A 164px overlay aligns that circle with the 98px avatar.
function framePreview(frame){
  const url=asset(frame.imageUrl);
  return url
    ? `<div class="avatar has-image"><span class="avatar-placeholder" aria-hidden="true">👤</span><img src="${esc(url)}" alt="${esc(frame.name||'Frame preview')}"></div>`
    : `<div class="avatar" style="border-color:${esc(frame.color)}">${esc(frame.decoration||'◉')}</div>`;
}
function draw(){const q=$('#search').value.toLowerCase(),filtered=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));if(!filtered.length){$('#records').innerHTML='<div class="panel empty">ไม่มีข้อมูล</div>';return}if(['frames','themes'].includes(view)){$('#records').innerHTML='<div class="grid">'+filtered.map(r=>`<article class="product"><div class="preview" ${view==='themes'?`style="background:${esc(r.colorPreview)}"`:''}>${view==='frames'?`${framePreview(r)}`:''}</div><span class="muted">${esc(r.id)}</span><h3>${esc(r.name)}</h3><strong>${r.price.toLocaleString()} coins</strong><div class="actions"><button data-edit="${esc(r.id)}">แก้ไข</button><button class="danger" data-delete="${esc(r.id)}">ลบ</button>${asset(r.imageUrl)?`<button data-download="${esc(r.id)}">ดาวน์โหลดรูป</button>`:''}</div></article>`).join('')+'</div>';$('#records').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.edit||b.dataset.delete||b.dataset.download,r=rows.find(x=>x.id===id);if(b.dataset.edit)openEditor(r);if(b.dataset.delete&&confirm(`ลบ ${r.name}? สิทธิ์การถือครองสินค้านี้จะถูกลบด้วย`)){b.disabled=true;try{await api(`/api/admin/${view}/${encodeURIComponent(id)}`,{method:'DELETE'});notice('ลบสินค้าแล้ว');await load()}catch(e){notice(e.message);b.disabled=false}}if(b.dataset.download){try{const response=await fetch(asset(r.imageUrl));if(!response.ok)throw Error('ดาวน์โหลดไม่สำเร็จ');download(await response.blob(),r.id+'.webp')}catch(e){notice(e.message)}}};}else{const cols=Object.keys(filtered[0]);$('#records').innerHTML='<div class="panel scroll"><table><thead><tr>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr></thead><tbody>'+filtered.map(r=>'<tr>'+cols.map(c=>`<td>${typeof r[c]==='object'&&r[c]!==null?'<pre>'+esc(JSON.stringify(r[c],null,2))+'</pre>':esc(r[c]??'—')}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>'}}
function openEditor(record){editing=record;imageUrl=record?.imageUrl||null;const f=$('#editForm');f.reset();f.elements.id.value=record?.id||'';f.elements.id.disabled=!!record;f.elements.name.value=record?.name||'';f.elements.price.value=record?.price??0;f.elements.color.value=record?.color||record?.colorPreview||'#6454dc';f.elements.decoration.value=record?.decoration||'';$('#frameFields').hidden=view!=='frames';$('#editTitle').textContent=(record?'แก้ไข':'เพิ่ม')+(view==='frames'?' Frame':' Theme');$('#formError').textContent='';preview();$('#editor').showModal()}
function preview(){$('#imagePreview').innerHTML=asset(imageUrl)?`<div class="preview">${framePreview({imageUrl,name:$('#editForm').elements.name.value})}</div>`:'<p class="muted">ยังไม่มีรูป</p>'}
$('#removeImage').onclick=()=>{imageUrl=null;$('#file').value='';preview()};$('#closeEditor').onclick=()=>$('#editor').close();
$('#editForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;$('#save').disabled=true;$('#closeEditor').disabled=true;$('#formError').textContent='';const kind=view;try{const file=$('#file').files[0];if(kind==='frames'&&file){if(file.size>5*1024*1024)throw Error('รูปต้องมีขนาดไม่เกิน 5 MB');const body=new FormData();body.append('image',file);imageUrl=(await api('/api/uploads',{method:'POST',body})).url;$('#file').value='';preview()}const body={id:f.elements.id.value,name:f.elements.name.value,price:Number(f.elements.price.value),...(kind==='frames'?{color:f.elements.color.value,decoration:f.elements.decoration.value,imageUrl}:{colorPreview:f.elements.color.value})};await api(`/api/admin/${kind}${editing?'/'+encodeURIComponent(editing.id):''}`,{method:editing?'PUT':'POST',body});$('#editor').close();notice('บันทึกสินค้าแล้ว');await load()}catch(e){$('#formError').textContent=e.message}finally{$('#save').disabled=false;$('#closeEditor').disabled=false}};
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function exportAll(){const b=$('#export'),kind=view;b.disabled=true;try{const all=[];let offset=0;while(true){const data=await api(`/api/admin/data/${kind}?skip=${offset}&take=100`);all.push(...data.rows);offset+=data.rows.length;if(offset>=data.total||!data.rows.length)break}download(new Blob([JSON.stringify(all,null,2)],{type:'application/json'}),kind+'.json');notice('ส่งออกข้อมูลแล้ว')}catch(e){notice(e.message)}finally{b.disabled=false}}
</script></body></html>
