<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GachaAddict — Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#151a30;
    --navy-900:#1b2242;
    --navy-800:#232c53;
    --navy-700:#323d6b;
    --line:#3b4677;
    --paper:#eef0fb;
    --paper-dim:#aab2dd;
    --coral:#ff6b5d;
    --sky:#4fb6e8;
    --gold:#ffc24b;
    --mint:#46c99b;
    --violet:#b98af0;
    --ok:#5fd58f;
    --warn:#ffc24b;
    --err:#ff6b6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy-950);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--gold);color:var(--navy-950);}
  h1,h2,h3{font-family:'Baloo 2',sans-serif;margin:0;}
  .muted{color:var(--paper-dim);}
  .muted.small{font-size:12px;}
  hr.divider{border:none;border-top:1px solid var(--line);margin:24px 0;}

  /* ---------- Top bar ---------- */
  .appbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 24px;
    border-bottom:1px solid var(--line);
    background:var(--navy-900);
    position:sticky;top:0;z-index:50;
  }
  .wordmark{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:20px;
    display:flex;
    align-items:center;
    gap:10px;
    white-space:nowrap;
  }
  .wordmark .capsule{
    width:20px;height:20px;border-radius:50%;
    background:linear-gradient(180deg,var(--coral) 50%, var(--paper) 50%);
    border:2px solid var(--navy-950);
    flex-shrink:0;
  }
  .appbar-spacer{flex:1;}
  .icon-btn{
    background:transparent;border:1px solid var(--line);color:var(--paper-dim);
    width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px;
  }
  .icon-btn:hover{color:var(--paper);border-color:var(--paper-dim);}
  #authArea{display:flex;align-items:center;gap:10px;}
  .user-chip{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 10px;border-radius:999px;border:1px solid var(--line);}
  .user-chip:hover{border-color:var(--paper-dim);}
  .user-chip img,.user-chip .avatar-ph{width:26px;height:26px;border-radius:50%;object-fit:cover;}
  .avatar-ph{background:var(--navy-700);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--paper);}
  .avatar-ph.small{width:26px;height:26px;}
  .avatar-ph.big{width:64px;height:64px;font-size:20px;border-radius:16px;}

  /* ---------- Shell / sidebar ---------- */
  .shell{display:flex;min-height:calc(100vh - 65px);}
  .sidebar{
    width:220px;flex-shrink:0;border-right:1px solid var(--line);
    padding:20px 14px;display:flex;flex-direction:column;gap:6px;
  }
  @media (max-width:880px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;border-right:none;border-bottom:1px solid var(--line);}
  }
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:999px;cursor:pointer;
    font-size:14px;font-weight:600;color:var(--paper-dim);
    border:1px solid transparent;background:transparent;text-align:left;
  }
  .nav-item:hover{color:var(--paper);}
  .nav-item.active{background:var(--navy-800);color:var(--paper);border-color:var(--line);}
  .nav-icon{font-size:15px;}
  .lock{font-size:10px;margin-left:auto;opacity:.7;}

  .main{flex:1;padding:28px 32px;overflow-y:auto;}
  .section-title{font-size:26px;font-weight:700;margin-bottom:4px;}
  .section-sub{color:var(--paper-dim);font-size:14px;margin:0 0 24px 0;max-width:60ch;}
  .loading{color:var(--paper-dim);padding:40px 0;text-align:center;}

  /* ---------- tags / badges ---------- */
  .tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--paper-dim);margin-right:6px;}
  .tag-mint{border-color:var(--mint);color:var(--mint);}
  .tag-count{font-size:11px;color:var(--paper-dim);}
  .tier-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;}
  .tier-r{background:var(--navy-700);color:var(--paper-dim);}
  .tier-sr{background:rgba(185,138,240,.18);color:var(--violet);border:1px solid var(--violet);}
  .tier-ssr{background:rgba(255,194,75,.18);color:var(--gold);border:1px solid var(--gold);}

  /* ---------- Card grid (gacha showcase) ---------- */
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
  .gacha-tile{background:var(--navy-900);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;}
  .gacha-tile:hover{transform:translateY(-3px);border-color:var(--gold);}
  .gacha-tile img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--navy-800);}
  .tile-placeholder{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:var(--navy-800);color:var(--paper-dim);font-size:26px;font-weight:700;font-family:'Baloo 2',sans-serif;}
  .tile-placeholder.small{width:56px;height:56px;aspect-ratio:auto;border-radius:10px;font-size:16px;flex-shrink:0;}
  .tile-body{padding:12px 14px;}
  .tile-title{font-weight:700;margin-bottom:6px;}
  .tile-meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:12px;color:var(--paper-dim);}

  /* ---------- modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,13,26,.75);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
  .modal-box{background:var(--navy-900);border:1px solid var(--line);border-radius:18px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:26px 28px;position:relative;}
  .modal-close{position:absolute;top:14px;right:14px;background:transparent;border:none;color:var(--paper-dim);font-size:16px;cursor:pointer;}
  .modal-close:hover{color:var(--paper);}
  .mini-title{font-size:15px;margin:20px 0 10px 0;}

  .detail-head{display:flex;gap:16px;align-items:center;margin-bottom:6px;}
  .detail-img{width:96px;height:96px;border-radius:16px;object-fit:cover;flex-shrink:0;}
  .detail-img.placeholder{display:flex;align-items:center;justify-content:center;background:var(--navy-800);color:var(--paper-dim);font-size:24px;font-weight:700;}

  .item-list{display:flex;flex-direction:column;gap:8px;}
  .item-row{display:flex;align-items:center;gap:10px;background:var(--navy-950);border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
  .item-row img,.item-thumb-ph{width:36px;height:36px;border-radius:8px;object-fit:cover;background:var(--navy-800);flex-shrink:0;}
  .item-row-name{flex:1;font-size:13px;}
  .item-rate{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--paper-dim);width:60px;text-align:right;}

  .pull-panel{margin-top:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .pull-count-row{display:flex;align-items:center;gap:6px;}
  .chip{background:var(--navy-800);border:1px solid var(--line);color:var(--paper-dim);padding:6px 12px;border-radius:999px;font-size:12px;cursor:pointer;}
  .chip:hover,.chip.active{color:var(--paper);border-color:var(--gold);}
  .pull-panel input[type=number]{width:60px;background:var(--navy-800);border:1px solid var(--line);color:var(--paper);border-radius:8px;padding:6px 8px;font-family:'IBM Plex Mono',monospace;}

  /* ---------- reveal overlay ---------- */
  .reveal-overlay{background:rgba(6,8,18,.92);z-index:300;}
  .reveal-box{max-width:760px;width:100%;text-align:center;}
  .reveal-title{font-size:24px;margin-bottom:22px;}
  .reveal-grid{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:26px;}
  .flip-card{width:120px;height:150px;perspective:900px;}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .6s ease;transform-style:preserve-3d;}
  .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-front,.flip-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);gap:6px;}
  .flip-front{background:var(--navy-800);font-size:30px;color:var(--paper-dim);}
  .flip-back{background:var(--navy-950);transform:rotateY(180deg);padding:10px;text-align:center;}
  .flip-back img{width:56px;height:56px;object-fit:cover;border-radius:8px;}
  .flip-back .flip-name{font-size:12px;font-weight:600;line-height:1.3;}
  .flip-back.tier-ssr{box-shadow:0 0 20px 2px rgba(255,194,75,.55);border-color:var(--gold);}
  .flip-back.tier-sr{box-shadow:0 0 16px 1px rgba(185,138,240,.5);border-color:var(--violet);}

  /* ---------- forms ---------- */
  .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px;}
  .form-field{display:flex;flex-direction:column;gap:5px;}
  .form-field.full{grid-column:1/-1;}
  .form-field label{font-size:12px;color:var(--paper-dim);}
  .form-field input, .form-field textarea{
    background:var(--navy-800);border:1px solid var(--line);color:var(--paper);
    padding:9px 10px;border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:13px;
  }
  .form-field textarea{resize:vertical;min-height:70px;}
  .form-field input:focus, .form-field textarea:focus{outline:2px solid var(--sky);outline-offset:1px;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--paper-dim);}
  .checkbox-row input{width:16px;height:16px;}

  .send-btn{
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;border:none;
    padding:10px 20px;border-radius:999px;cursor:pointer;color:var(--navy-950);
  }
  .send-btn:active{transform:translateY(1px);}
  .send-btn:disabled{opacity:.5;cursor:default;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--paper-dim);padding:7px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;}
  .btn-ghost:hover{color:var(--paper);border-color:var(--paper-dim);}
  .btn-ghost.danger{color:var(--err);border-color:rgba(255,107,107,.4);}
  .btn-ghost.danger:hover{border-color:var(--err);}

  /* ---------- auth modal ---------- */
  .auth-tabs{display:flex;gap:6px;margin-bottom:18px;}
  .auth-tab{flex:1;background:var(--navy-800);border:1px solid var(--line);color:var(--paper-dim);padding:9px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;}
  .auth-tab.active{background:var(--navy-700);color:var(--paper);border-color:var(--gold);}
  .auth-divider{text-align:center;color:var(--paper-dim);font-size:12px;margin:18px 0 10px 0;}

  /* ---------- manage view ---------- */
  .manage-row{display:flex;align-items:center;gap:12px;background:var(--navy-900);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;}
  .manage-row img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex-shrink:0;}
  .manage-row-info{flex:1;}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}

  .item-edit-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .item-edit-row{display:flex;gap:8px;align-items:center;}
  .item-edit-row input{flex:1;background:var(--navy-800);border:1px solid var(--line);color:var(--paper);padding:8px 9px;border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:12px;min-width:0;}

  /* ---------- history ---------- */
  .history-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .history-row{display:flex;align-items:center;gap:12px;background:var(--navy-900);border:1px solid var(--line);border-radius:12px;padding:10px 14px;}
  .history-row img,.history-row .item-thumb-ph{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;}
  .history-info{flex:1;}

  /* ---------- players ---------- */
  .players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .player-card{background:var(--navy-900);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
  .player-card img,.player-card .avatar-ph{width:52px;height:52px;border-radius:50%;object-fit:cover;margin:0 auto 8px auto;}

  /* ---------- profile ---------- */
  .profile-card{background:var(--navy-900);border:1px solid var(--line);border-radius:16px;padding:22px 24px;max-width:560px;}
  .profile-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
  .profile-head img{width:64px;height:64px;border-radius:16px;object-fit:cover;}

  /* ---------- misc states ---------- */
  .empty-state{padding:40px 10px;text-align:center;color:var(--paper-dim);}
  .error-block{background:rgba(255,107,107,.1);border:1px solid var(--err);border-radius:12px;padding:16px 18px;color:var(--paper);}
  .error-block strong{color:var(--err);display:block;margin-bottom:4px;}

  /* ---------- toast ---------- */
  .toast-host{position:fixed;bottom:20px;right:20px;z-index:500;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .toast{
    background:var(--navy-900);border:1px solid var(--line);border-left:4px solid var(--sky);
    padding:10px 16px;border-radius:10px;font-size:13px;max-width:320px;
    opacity:0;transform:translateY(6px);transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .toast-ok{border-left-color:var(--ok);}
  .toast-warn{border-left-color:var(--warn);}
  .toast-err{border-left-color:var(--err);}
</style>
</head>
<body>

<div class="toast-host" id="toastHost"></div>

<header class="appbar">
  <div class="wordmark"><span class="capsule"></span>GachaAddict</div>
  <div class="appbar-spacer"></div>
  <button class="icon-btn" id="settingsBtn" title="ตั้งค่า">⚙</button>
  <div id="authArea"></div>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

<div id="modalRoot"></div>

<script>
/* ================= constants ================= */
const LS_KEYS = { baseUrl:'ga_base_url', token:'ga_token', user:'ga_user', firebaseCfg:'ga_firebase_cfg' };

// Firebase Web Config (public, safe to ship in client code) — used for "เข้าสู่ระบบด้วย Google".
// This is the project's default config; a value saved via the ⚙ settings modal (localStorage) always wins.
const DEFAULT_FIREBASE_CONFIG = {
  apiKey: "AIzaSyAYwfwcurH8vTYloDTG7k_1tbCTDMeR8Dw",
  authDomain: "gachaaddict.firebaseapp.com",
  projectId: "gachaaddict",
  storageBucket: "gachaaddict.firebasestorage.app",
  messagingSenderId: "975534187642",
  appId: "1:975534187642:web:f0486f7e38fd7118fb87c3",
  measurementId: "G-ZF7M66987L"
};

const NAV_ITEMS = [
  { id:'gacha',   label:'สุ่มกาชา',        icon:'🎰' },
  { id:'manage',  label:'สำรับของฉัน',      icon:'🗂️' },
  { id:'history', label:'ประวัติการสุ่ม',   icon:'📜' },
  { id:'players', label:'ผู้เล่นทั้งหมด',   icon:'👥' },
  { id:'profile', label:'โปรไฟล์',         icon:'👤' },
];
const AUTH_VIEWS = new Set(['manage','history','players','profile']);

/* ================= state ================= */
function defaultBaseUrl(){
  if (location.protocol.startsWith('http')) return location.origin;
  return 'http://localhost:3000';
}
let storedUser = null;
try { storedUser = JSON.parse(localStorage.getItem(LS_KEYS.user) || 'null'); } catch(e) { storedUser = null; }
let storedFirebaseCfg = null;
try { storedFirebaseCfg = JSON.parse(localStorage.getItem(LS_KEYS.firebaseCfg) || 'null'); } catch(e) { storedFirebaseCfg = null; }

const state = {
  baseUrl: localStorage.getItem(LS_KEYS.baseUrl) || defaultBaseUrl(),
  token: localStorage.getItem(LS_KEYS.token) || '',
  user: storedUser,
  firebaseConfig: storedFirebaseCfg || DEFAULT_FIREBASE_CONFIG,
  view: 'gacha',
  historyItems: [],
  historySkip: 0,
};

function persist(){
  localStorage.setItem(LS_KEYS.token, state.token || '');
  localStorage.setItem(LS_KEYS.user, state.user ? JSON.stringify(state.user) : '');
}

/* ================= helpers ================= */
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const escapeAttr = escapeHtml;

function initials(name){
  return (name || '?').trim().slice(0, 2).toUpperCase();
}
function fmtDate(iso){
  try { return new Date(iso).toLocaleString('th-TH', { dateStyle:'medium', timeStyle:'short' }); }
  catch(e) { return iso; }
}
function tierFor(item, items, isEqualRate){
  const hasRates = (items||[]).some(i => Number(i.rate) > 0);
  if (isEqualRate || !hasRates) return { label:'R', cls:'tier-r' };
  const rate = Number(item.rate) || 0;
  if (rate > 0 && rate <= 5) return { label:'SSR', cls:'tier-ssr' };
  if (rate > 0 && rate <= 15) return { label:'SR', cls:'tier-sr' };
  return { label:'R', cls:'tier-r' };
}
function errorBlock(title, msg){
  return `<div class="error-block"><strong>${escapeHtml(title)}</strong><p>${escapeHtml(msg)}</p></div>`;
}
function emptyState(title, sub){
  return `<div class="empty-state"><p>${escapeHtml(title)}</p><p class="muted">${escapeHtml(sub)}</p></div>`;
}

/* ================= toast ================= */
function toast(msg, type='ok'){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  host.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, 3200);
}

/* ================= modal ================= */
function modalBox(html){
  const box = document.createElement('div');
  box.className = 'modal-box';
  box.innerHTML = html;
  return box;
}
function escCloseHandler(e){ if (e.key === 'Escape') closeModal(); }
function openModal(box){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.appendChild(box);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.getElementById('modalRoot').appendChild(overlay);
  document.addEventListener('keydown', escCloseHandler);
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
  document.removeEventListener('keydown', escCloseHandler);
}

/* ================= api ================= */
async function api(path, { method='GET', body, auth=false } = {}){
  const headers = { 'Content-Type':'application/json' };
  if (auth) {
    if (!state.token) {
      const err = new Error('ยังไม่ได้เข้าสู่ระบบ');
      err.status = 401;
      throw err;
    }
    headers['Authorization'] = 'Bearer ' + state.token;
  }

  let res;
  try {
    res = await fetch(state.baseUrl.replace(/\/$/, '') + path, {
      method,
      headers,
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
  } catch (networkErr) {
    throw new Error('เชื่อมต่อ backend ไม่ได้ — เช็ค Base URL ในปุ่ม ⚙ ตั้งค่า และเช็คว่า server เปิดอยู่ไหม');
  }

  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e) { data = text; }

  if (res.status === 401 && auth) {
    state.token = ''; state.user = null; persist(); renderAuthArea();
  }

  if (!res.ok) {
    const msg = (data && data.error) || (typeof data === 'string' && data) || `เกิดข้อผิดพลาด (${res.status})`;
    const err = new Error(msg);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

function requireLogin(actionLabel){
  if (state.user) return true;
  toast(`เข้าสู่ระบบก่อนถึงจะ${actionLabel || 'ใช้งานส่วนนี้ได้'}`, 'warn');
  openAuthModal('login');
  return false;
}

/* ================= shell: appbar / sidebar / routing ================= */
function renderAuthArea(){
  const area = document.getElementById('authArea');
  if (state.user) {
    area.innerHTML = `
      <div class="user-chip" id="userChip">
        ${state.user.avatarUrl ? `<img src="${escapeAttr(state.user.avatarUrl)}" alt="">` : `<div class="avatar-ph small">${escapeHtml(initials(state.user.username))}</div>`}
        <span>${escapeHtml(state.user.username)}</span>
      </div>
      <button class="btn-ghost" id="logoutBtn">ออกจากระบบ</button>
    `;
    document.getElementById('userChip').addEventListener('click', () => navigate('profile'));
    document.getElementById('logoutBtn').addEventListener('click', logout);
  } else {
    area.innerHTML = `<button class="send-btn" id="loginBtn" style="background:var(--coral)">เข้าสู่ระบบ</button>`;
    document.getElementById('loginBtn').addEventListener('click', () => openAuthModal('login'));
  }
}

function renderSidebar(){
  const nav = document.getElementById('sidebar');
  nav.innerHTML = NAV_ITEMS.map(n => `
    <button class="nav-item ${state.view === n.id ? 'active' : ''}" data-nav="${n.id}">
      <span class="nav-icon">${n.icon}</span>${n.label}
      ${AUTH_VIEWS.has(n.id) && !state.user ? '<span class="lock">🔒</span>' : ''}
    </button>
  `).join('');
  nav.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => navigate(b.dataset.nav)));
}

function navigate(view){
  if (AUTH_VIEWS.has(view) && !requireLogin()) return;
  state.view = view;
  renderSidebar();
  renderMain();
}

function renderMain(){
  const main = document.getElementById('main');
  main.innerHTML = '<div class="loading">กำลังโหลด…</div>';
  switch (state.view) {
    case 'gacha':   renderGachaView(main); break;
    case 'manage':  renderManageView(main); break;
    case 'history': state.historyItems = []; state.historySkip = 0; loadMoreHistory(main, true); break;
    case 'players': renderPlayersView(main); break;
    case 'profile': renderProfileView(main); break;
    default:        renderGachaView(main);
  }
}

function logout(){
  state.token = ''; state.user = null; persist();
  renderAuthArea();
  toast('ออกจากระบบแล้ว', 'ok');
  if (AUTH_VIEWS.has(state.view)) state.view = 'gacha';
  renderSidebar();
  renderMain();
}

/* ================= auth modal ================= */
function openAuthModal(tab){
  const box = modalBox('');
  openModal(box);
  renderAuthModalContent(box, tab || 'login');
}

function renderAuthModalContent(box, tab){
  box.innerHTML = `
    <button class="modal-close" data-close>✕</button>
    <div class="auth-tabs">
      <button class="auth-tab ${tab === 'login' ? 'active' : ''}" data-tab="login">เข้าสู่ระบบ</button>
      <button class="auth-tab ${tab === 'register' ? 'active' : ''}" data-tab="register">สมัครสมาชิก</button>
    </div>
    <div class="form-grid" id="authFormArea"></div>
    <button class="send-btn" id="authSubmitBtn" style="background:var(--mint);width:100%;">${tab === 'login' ? 'เข้าสู่ระบบ' : 'สมัครสมาชิก'}</button>
    <div class="auth-divider">หรือ</div>
    <button class="send-btn" id="googleBtn" style="background:#fff;color:#1b2242;width:100%;">เข้าสู่ระบบด้วย Google</button>
    <p class="muted small" id="googleHint" style="margin-top:8px;"></p>
  `;
  box.querySelector('[data-close]').addEventListener('click', closeModal);
  box.querySelectorAll('.auth-tab').forEach(t => t.addEventListener('click', () => renderAuthModalContent(box, t.dataset.tab)));
  renderAuthFormFields(box, tab);
  box.querySelector('#authSubmitBtn').addEventListener('click', () => submitAuthForm(box, tab));
  wireGoogleButton(box);
}

function renderAuthFormFields(box, tab){
  const area = box.querySelector('#authFormArea');
  if (tab === 'login') {
    area.innerHTML = `
      <div class="form-field full"><label>Email</label><input id="a_email" type="email" placeholder="player@example.com"></div>
      <div class="form-field full"><label>Password</label><input id="a_password" type="password"></div>
    `;
  } else {
    area.innerHTML = `
      <div class="form-field full"><label>Email</label><input id="a_email" type="email" placeholder="player@example.com"></div>
      <div class="form-field full"><label>Username</label><input id="a_username" placeholder="player01"></div>
      <div class="form-field full"><label>Password</label><input id="a_password" type="password"></div>
      <div class="form-field full"><label>Phone No (ไม่บังคับ)</label><input id="a_phone"></div>
    `;
  }
}

async function submitAuthForm(box, tab){
  const email = box.querySelector('#a_email').value.trim();
  const password = box.querySelector('#a_password').value;
  try {
    let res;
    if (tab === 'login') {
      if (!email || !password) { toast('กรุณากรอก email และ password', 'warn'); return; }
      res = await api('/api/auth/login', { method:'POST', body:{ email, password } });
    } else {
      const username = box.querySelector('#a_username').value.trim();
      const phoneNo = box.querySelector('#a_phone').value.trim();
      if (!email || !username || !password) { toast('กรุณากรอก email, username และ password', 'warn'); return; }
      res = await api('/api/auth/register', { method:'POST', body:{ email, username, password, phoneNo: phoneNo || undefined } });
    }
    onAuthSuccess(res);
  } catch (err) {
    toast((tab === 'login' ? 'เข้าสู่ระบบไม่สำเร็จ: ' : 'สมัครสมาชิกไม่สำเร็จ: ') + err.message, 'err');
  }
}

function onAuthSuccess(res){
  state.token = res.token;
  state.user = res.user;
  persist();
  closeModal();
  renderAuthArea();
  toast(`ยินดีต้อนรับ ${res.user.username}!`, 'ok');
  renderMain();
}

/* ----- optional Google sign-in (Firebase client SDK, loaded on demand) ----- */
let firebaseSdkPromise = null;
function ensureFirebaseSdkLoaded(){
  if (window.firebase) return Promise.resolve();
  if (firebaseSdkPromise) return firebaseSdkPromise;
  firebaseSdkPromise = new Promise((resolve, reject) => {
    const s1 = document.createElement('script');
    s1.src = 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js';
    s1.onload = () => {
      const s2 = document.createElement('script');
      s2.src = 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js';
      s2.onload = resolve;
      s2.onerror = () => reject(new Error('โหลด Firebase SDK ไม่สำเร็จ'));
      document.head.appendChild(s2);
    };
    s1.onerror = () => reject(new Error('โหลด Firebase SDK ไม่สำเร็จ'));
    document.head.appendChild(s1);
  });
  return firebaseSdkPromise;
}

function wireGoogleButton(box){
  const btn = box.querySelector('#googleBtn');
  const hint = box.querySelector('#googleHint');
  if (!state.firebaseConfig) {
    hint.textContent = 'ยังไม่ได้ตั้งค่า Firebase Web Config — กดปุ่ม ⚙ ตั้งค่า ด้านบนเพื่อเปิดใช้งาน Google Sign-In';
    btn.disabled = true;
    btn.style.opacity = 0.5;
    return;
  }
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      await ensureFirebaseSdkLoaded();
      if (!window._gaFirebaseInited) {
        firebase.initializeApp(state.firebaseConfig);
        window._gaFirebaseInited = true;
      }
      const provider = new firebase.auth.GoogleAuthProvider();
      const result = await firebase.auth().signInWithPopup(provider);
      const idToken = await result.user.getIdToken();
      const res = await api('/api/auth/google', { method:'POST', body:{ idToken } });
      onAuthSuccess(res);
    } catch (err) {
      toast('เข้าสู่ระบบด้วย Google ไม่สำเร็จ: ' + (err.message || err), 'err');
    } finally {
      btn.disabled = false;
    }
  });
}

function openSettingsModal(){
  const box = modalBox('');
  openModal(box);
  box.innerHTML = `
    <button class="modal-close" data-close>✕</button>
    <h2>ตั้งค่า</h2>
    <div class="form-field full" style="margin:18px 0;">
      <label>Base URL ของ backend</label>
      <input id="s_baseUrl" value="${escapeAttr(state.baseUrl)}">
    </div>
    <div class="form-field full" style="margin-bottom:8px;">
      <label>Firebase Web Config (JSON) — ไม่บังคับ สำหรับปุ่ม "เข้าสู่ระบบด้วย Google"</label>
      <textarea id="s_firebaseCfg" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","appId":"..."}'>${state.firebaseConfig ? escapeHtml(JSON.stringify(state.firebaseConfig, null, 2)) : ''}</textarea>
    </div>
    <p class="muted small">นี่คือ Firebase Web Config (public) — คนละไฟล์กับ <code>firebase-admin-sdk.json</code> ฝั่ง server นะ อ่านเพิ่มได้ที่ FIREBASE_ADMIN_SDK_SETUP.md</p>
    <button class="send-btn" id="saveSettingsBtn" style="background:var(--sky);margin-top:10px;">บันทึก</button>
  `;
  box.querySelector('[data-close]').addEventListener('click', closeModal);
  box.querySelector('#saveSettingsBtn').addEventListener('click', () => {
    const url = box.querySelector('#s_baseUrl').value.trim().replace(/\/$/, '');
    if (url) { state.baseUrl = url; localStorage.setItem(LS_KEYS.baseUrl, state.baseUrl); }

    const cfgRaw = box.querySelector('#s_firebaseCfg').value.trim();
    if (cfgRaw) {
      try {
        state.firebaseConfig = JSON.parse(cfgRaw);
        localStorage.setItem(LS_KEYS.firebaseCfg, JSON.stringify(state.firebaseConfig));
      } catch (e) {
        toast('Firebase config ไม่ใช่ JSON ที่ถูกต้อง', 'err');
        return;
      }
    } else {
      state.firebaseConfig = DEFAULT_FIREBASE_CONFIG;
      localStorage.removeItem(LS_KEYS.firebaseCfg);
    }
    toast('บันทึกการตั้งค่าแล้ว', 'ok');
    closeModal();
    renderMain();
  });
}

/* ================= gacha (browse + pull) ================= */
async function renderGachaView(main){
  let cards;
  try {
    cards = await api('/api/cards?take=60');
  } catch (err) {
    main.innerHTML = errorBlock('โหลดสำรับกาชาไม่สำเร็จ', err.message);
    return;
  }
  main.innerHTML = `
    <h1 class="section-title">สุ่มกาชา</h1>
    <p class="section-sub">เลือกสำรับที่อยากลองเสี่ยงดวง — ดูอัตราดรอปของแต่ละไอเท็มก่อนสุ่มได้เลย</p>
    <div class="card-grid" id="cardGrid">
      ${cards.length ? cards.map(cardTileHtml).join('') : emptyState('ยังไม่มีสำรับกาชาในระบบ', 'เข้าสู่ระบบแล้วไปที่ "สำรับของฉัน" เพื่อสร้างสำรับแรก')}
    </div>
  `;
  main.querySelectorAll('[data-card-id]').forEach(el => {
    el.addEventListener('click', () => openCardDetail(Number(el.dataset.cardId)));
  });
}

function cardTileHtml(c){
  const img = c.cardImage
    ? `<img src="${escapeAttr(c.cardImage)}" alt="">`
    : `<div class="tile-placeholder">${escapeHtml(initials(c.title))}</div>`;
  return `
  <div class="gacha-tile" data-card-id="${c.id}">
    ${img}
    <div class="tile-body">
      <div class="tile-title">${escapeHtml(c.title)}</div>
      <div class="tile-meta">
        ${c.frame ? `<span class="tag">${escapeHtml(c.frame)}</span>` : ''}
        ${c.isEqualRate ? `<span class="tag tag-mint">Equal rate</span>` : ''}
        <span class="tag-count">${(c.cardItems || []).length} ไอเท็ม</span>
      </div>
    </div>
  </div>`;
}

async function openCardDetail(id){
  const box = modalBox('<div class="loading">กำลังโหลดสำรับ…</div>');
  openModal(box);
  let card;
  try {
    card = await api(`/api/cards/${id}`);
  } catch (err) {
    box.innerHTML = errorBlock('โหลดไม่สำเร็จ', err.message);
    return;
  }
  const items = card.cardItems || [];
  box.innerHTML = `
    <button class="modal-close" data-close>✕</button>
    <div class="detail-head">
      ${card.cardImage ? `<img class="detail-img" src="${escapeAttr(card.cardImage)}" alt="">` : `<div class="detail-img placeholder">${escapeHtml(initials(card.title))}</div>`}
      <div>
        <h2>${escapeHtml(card.title)}</h2>
        <div class="tile-meta" style="margin-top:6px;">
          ${card.frame ? `<span class="tag">${escapeHtml(card.frame)}</span>` : ''}
          ${card.animation ? `<span class="tag">${escapeHtml(card.animation)}</span>` : ''}
          ${card.isEqualRate ? '<span class="tag tag-mint">Equal rate</span>' : ''}
        </div>
      </div>
    </div>
    <h3 class="mini-title">ไอเท็มในสำรับ (${items.length})</h3>
    <div class="item-list">
      ${items.length ? items.map(it => itemRowHtml(it, items, card.isEqualRate)).join('') : '<p class="muted">สำรับนี้ยังไม่มีไอเท็ม</p>'}
    </div>
    ${items.length ? `
    <div class="pull-panel">
      <div class="pull-count-row">
        <button class="chip" data-count="1">x1</button>
        <button class="chip" data-count="5">x5</button>
        <button class="chip" data-count="10">x10</button>
        <input type="number" id="pullCount" min="1" max="10" value="1">
      </div>
      <button class="send-btn" id="pullBtn" style="background:var(--gold)">🎲 สุ่มกาชา</button>
    </div>` : ''}
  `;
  box.querySelector('[data-close]').addEventListener('click', closeModal);
  box.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => { box.querySelector('#pullCount').value = chip.dataset.count; });
  });
  const pullBtn = box.querySelector('#pullBtn');
  if (pullBtn) {
    pullBtn.addEventListener('click', () => {
      const count = Math.max(1, Math.min(10, Number(box.querySelector('#pullCount').value) || 1));
      doPull(card.id, count, items, card.isEqualRate);
    });
  }
}

function itemRowHtml(it, items, isEqualRate){
  const tier = tierFor(it, items, isEqualRate);
  return `<div class="item-row">
    ${it.imageUrl ? `<img src="${escapeAttr(it.imageUrl)}" alt="">` : `<div class="item-thumb-ph"></div>`}
    <div class="item-row-name">${escapeHtml(it.name)}</div>
    <span class="tier-badge ${tier.cls}">${tier.label}</span>
    <span class="item-rate">${isEqualRate ? 'เท่ากัน' : (Number(it.rate) || 0) + '%'}</span>
  </div>`;
}

async function doPull(cardId, count, items, isEqualRate){
  if (!requireLogin('สุ่มกาชาได้')) return;
  let results;
  try {
    results = await api(`/api/cards/${cardId}/pull`, { method:'POST', auth:true, body:{ count } });
  } catch (err) {
    toast('สุ่มไม่สำเร็จ: ' + err.message, 'err');
    return;
  }
  closeModal();
  showRevealOverlay(results, items, isEqualRate);
}

function showRevealOverlay(results, items, isEqualRate){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay reveal-overlay';
  overlay.innerHTML = `
    <div class="reveal-box">
      <h2 class="reveal-title">ผลการสุ่ม</h2>
      <div class="reveal-grid">
        ${results.map((r, i) => {
          const it = r.cardItem || {};
          const tier = tierFor(it, items, isEqualRate);
          return `<div class="flip-card" data-delay="${i * 180}">
            <div class="flip-inner">
              <div class="flip-front">?</div>
              <div class="flip-back ${tier.cls}">
                ${it.imageUrl ? `<img src="${escapeAttr(it.imageUrl)}" alt="">` : ''}
                <div class="flip-name">${escapeHtml(it.name || '-')}</div>
                <span class="tier-badge ${tier.cls}">${tier.label}</span>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
      <button class="send-btn" id="revealCloseBtn" style="background:var(--sky)">เสร็จสิ้น</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelectorAll('.flip-card').forEach(el => {
    setTimeout(() => el.classList.add('flipped'), Number(el.dataset.delay) || 0);
  });
  overlay.querySelector('#revealCloseBtn').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

/* ================= manage my cards ================= */
async function renderManageView(main){
  let cards;
  try {
    cards = await api('/api/cards?take=100');
  } catch (err) {
    main.innerHTML = errorBlock('โหลดสำรับไม่สำเร็จ', err.message);
    return;
  }
  const mine = cards.filter(c => c.createBy === state.user.id);
  main.innerHTML = `
    <h1 class="section-title">สำรับของฉัน</h1>
    <p class="section-sub">สร้าง แก้ไข และจัดการไอเท็มในสำรับกาชาของคุณเอง</p>
    <button class="send-btn" id="newCardBtn" style="background:var(--mint);margin-bottom:20px;">+ สร้างสำรับใหม่</button>
    <div id="myCardsList">${mine.length ? mine.map(manageCardRowHtml).join('') : emptyState('คุณยังไม่มีสำรับ', 'กดปุ่มด้านบนเพื่อสร้างสำรับแรก')}</div>
  `;
  document.getElementById('newCardBtn').addEventListener('click', () => openCardFormModal());
  wireManageCardRows(mine);
}

function manageCardRowHtml(c){
  const img = c.cardImage
    ? `<img src="${escapeAttr(c.cardImage)}" alt="">`
    : `<div class="tile-placeholder small">${escapeHtml(initials(c.title))}</div>`;
  return `<div class="manage-row" data-id="${c.id}">
    ${img}
    <div class="manage-row-info">
      <div class="tile-title">${escapeHtml(c.title)}</div>
      <div class="tile-meta">${(c.cardItems || []).length} ไอเท็ม ${c.isEqualRate ? '· Equal rate' : ''}</div>
    </div>
    <div class="row-actions">
      <button class="btn-ghost" data-action="items" data-id="${c.id}">ไอเท็ม</button>
      <button class="btn-ghost" data-action="edit" data-id="${c.id}">แก้ไข</button>
      <button class="btn-ghost danger" data-action="delete" data-id="${c.id}">ลบ</button>
    </div>
  </div>`;
}

function wireManageCardRows(mine){
  document.getElementById('myCardsList').addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const id = Number(btn.dataset.id);
    const card = mine.find(c => c.id === id);
    if (btn.dataset.action === 'edit') {
      openCardFormModal(card);
    } else if (btn.dataset.action === 'items') {
      openItemsModal(card);
    } else if (btn.dataset.action === 'delete') {
      if (!confirm(`ลบสำรับ "${card.title}"? ไอเท็มทั้งหมดในสำรับนี้จะถูกลบด้วย`)) return;
      try {
        await api(`/api/cards/${id}`, { method:'DELETE', auth:true });
        toast('ลบสำรับแล้ว', 'ok');
        navigate('manage');
      } catch (err) {
        toast('ลบไม่สำเร็จ: ' + err.message, 'err');
      }
    }
  });
}

    <h2>${existing ? 'แก้ไขสำรับ' : 'สร้างสำรับใหม่'}</h2>

      <div class="form-field full"><label>Card Image URL</label><input id="f_cardImage" value="${existing ? escapeAttr(existing.cardImage || '') : ''}"></div>
      <div class="form-field"><label>Frame</label><input id="f_frame" value="${existing ? escapeAttr(existing.frame || '') : ''}"></div>
      <div class="form-field"><label>Animation</label><input id="f_animation" value="${existing ? escapeAttr(existing.animation || '') : ''}"></div>
      <div class="form-field full"><label class="checkbox-row"><input type="checkbox" id="f_equal" ${existing && existing.isEqualRate ? 'checked' : ''}> สุ่มเท่ากันทุกไอเท็ม (Equal rate)</label></div>

  box.querySelector('[data-close]').addEventListener('click', closeModal);
  box.querySelector('#saveCardBtn').addEventListener('click', async () => {

      title: box.querySelector('#f_title').value.trim(),
      cardImage: box.querySelector('#f_cardImage').value.trim(),
      frame: box.querySelector('#f_frame').value.trim(),
      animation: box.querySelector('#f_animation').value.trim(),

      closeModal();
      navigate('manage');
    } catch (err) {
      toast('บันทึกไม่สำเร็จ: ' + err.message, 'err');

    <h3 class="mini-title">เพิ่มหลายไอเท็มพร้อมกัน</h3>
    <p class="muted small">1 บรรทัด = 1 ไอเท็ม รูปแบบ: <code>ชื่อ, Image URL (ไม่บังคับ), Rate % (ไม่บังคับ)</code> เช่น <code>Ichigo, https://example.com/img.png, 5</code></p>
    <textarea id="bulkAddArea" rows="5" style="width:100%;background:var(--navy-800);border:1px solid var(--line);border-radius:10px;color:var(--paper);padding:10px 12px;font-family:'IBM Plex Mono',monospace;font-size:13px;resize:vertical;" placeholder="Ichigo, https://example.com/ichigo.png, 5&#10;Rukia, https://example.com/rukia.png, 10&#10;Chappy"></textarea>
    <button class="btn-ghost" id="bulkAddBtn" style="margin-top:8px;">+ เพิ่มทั้งหมดจากรายการ</button>
    <hr class="divider">
    <h3 class="mini-title">ทดลองสุ่ม (ไม่บันทึกลง database)</h3>
    <p class="muted small">คำนวณสุ่มจากไอเท็มชุดปัจจุบันสด ๆ ในเบราว์เซอร์ ไม่เรียก API สุ่มจริงและไม่บันทึกประวัติ ใช้เช็คสัดส่วนก่อนเปิดให้คนอื่นสุ่มจริง</p>
    <div class="item-edit-row">
      <input type="number" id="simCount" value="10" min="1" max="1000" style="flex:0 0 100px;">
      <button class="btn-ghost" id="simulateBtn">🎲 สุ่มทดสอบ</button>
    </div>
    <div id="simResults" style="margin-top:12px;"></div>
  `;
  box.querySelector('[data-close]').addEventListener('click', closeModal);

  items.forEach(it => {
    const row = box.querySelector(`[data-item-id="${it.id}"]`);
    row.querySelector('[data-action="save"]').addEventListener('click', async () => {
      const name = row.querySelector('[data-field="name"]').value.trim();
      const imageUrl = row.querySelector('[data-field="imageUrl"]').value.trim();
      const rate = row.querySelector('[data-field="rate"]').value.trim();
      if (!name) { toast('กรุณาใส่ชื่อไอเท็ม', 'warn'); return; }
      try {
        await api(`/api/cards/${cardId}/items/${it.id}`, { method:'PUT', auth:true, body:{ name, imageUrl, rate } });
        toast('บันทึกไอเท็มแล้ว', 'ok');
        refreshItemsModal(box, card);
      } catch (err) {
        toast('บันทึกไม่สำเร็จ: ' + err.message, 'err');
      }
    });
    row.querySelector('[data-action="delete"]').addEventListener('click', async () => {
      if (!confirm(`ลบไอเท็ม "${it.name}"?`)) return;
      try {
        await api(`/api/cards/${cardId}/items/${it.id}`, { method:'DELETE', auth:true });
        toast('ลบไอเท็มแล้ว', 'ok');
        refreshItemsModal(box, card);
      } catch (err) {
        toast('ลบไม่สำเร็จ: ' + err.message, 'err');
      }
    });
  });

  box.querySelector('#addItemBtn').addEventListener('click', async () => {
    const name = box.querySelector('[data-new="name"]').value.trim();
    const imageUrl = box.querySelector('[data-new="imageUrl"]').value.trim();
    const rate = box.querySelector('[data-new="rate"]').value.trim();
    if (!name) { toast('กรุณาใส่ชื่อไอเท็ม', 'warn'); return; }
    try {
      await api(`/api/cards/${cardId}/items`, { method:'POST', auth:true, body:{ name, imageUrl, rate } });
      toast('เพิ่มไอเท็มแล้ว', 'ok');
      refreshItemsModal(box, card);
    } catch (err) {
      toast('เพิ่มไม่สำเร็จ: ' + err.message, 'err');
    }
  });

  box.querySelector('#bulkAddBtn').addEventListener('click', async () => {
    const bulkBtn = box.querySelector('#bulkAddBtn');
    const raw = box.querySelector('#bulkAddArea').value;
    const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) { toast('กรุณาใส่รายการไอเท็มอย่างน้อย 1 บรรทัด', 'warn'); return; }

    bulkBtn.disabled = true;
    const originalLabel = bulkBtn.textContent;
    let ok = 0, fail = 0;
    for (const line of lines) {
      const parts = line.split(',').map(p => p.trim());
      const name = parts[0];
      const imageUrl = parts[1] || undefined;
      const rate = parts[2] || undefined;
      if (!name) { fail++; continue; }
      bulkBtn.textContent = `กำลังเพิ่ม... (${ok + fail + 1}/${lines.length})`;
      try {
        await api(`/api/cards/${cardId}/items`, { method:'POST', auth:true, body:{ name, imageUrl, rate } });
        ok++;
      } catch (err) {
        fail++;
      }
    }
    bulkBtn.disabled = false;
    bulkBtn.textContent = originalLabel;
    toast(`เพิ่มไอเท็มสำเร็จ ${ok} รายการ${fail ? `, ล้มเหลว ${fail} รายการ` : ''}`, fail ? 'warn' : 'ok');
    refreshItemsModal(box, card);
  });

  box.querySelector('#simulateBtn').addEventListener('click', () => {
    if (!items.length) { toast('ยังไม่มีไอเท็มให้สุ่ม', 'warn'); return; }
    const count = Math.max(1, Math.min(1000, Number(box.querySelector('#simCount').value) || 1));
    const results = simulateLocalPulls(items, card.isEqualRate, count);
    const tally = {};
    results.forEach(r => { tally[r.name] = (tally[r.name] || 0) + 1; });
    const rows = Object.entries(tally)
      .sort((a, b) => b[1] - a[1])
      .map(([name, n]) => `
        <div class="manage-row" style="padding:8px 12px;">
          <div class="manage-row-info"><div class="tile-title" style="font-size:14px;">${escapeHtml(name)}</div></div>
          <div class="muted small">${n} ครั้ง (${(n / count * 100).toFixed(1)}%)</div>
        </div>`)
      .join('');
    box.querySelector('#simResults').innerHTML = `
      <p class="muted small">ผลจากการสุ่มทดสอบ ${count} ครั้ง (ไม่บันทึกลง database):</p>
      ${rows}
    `;
  });
}

/* ----- client-side gacha simulator (mirrors src/utils/gacha.js, no API/DB involved) ----- */
function pickEqualRateLocal(items){
  return items[Math.floor(Math.random() * items.length)];
}
function pickWeightedRateLocal(items){
  const totalWeight = items.reduce((sum, it) => sum + (Number(it.rate) > 0 ? Number(it.rate) : 0), 0);
  if (totalWeight <= 0) return pickEqualRateLocal(items);
  let roll = Math.random() * totalWeight;
  for (const it of items) {
    const weight = Number(it.rate) > 0 ? Number(it.rate) : 0;
    if (roll < weight) return it;
    roll -= weight;
  }
  return items[items.length - 1];
}
function simulateLocalPulls(items, isEqualRate, count){
  const results = [];
  for (let i = 0; i < count; i++) {
    results.push(isEqualRate ? pickEqualRateLocal(items) : pickWeightedRateLocal(items));
  }
  return results;
}

function itemEditRowHtml(it){
  return `<div class="item-edit-row" data-item-id="${it.id}">
    <input type="text" data-field="name" value="${escapeAttr(it.name)}">
    <input type="text" data-field="imageUrl" value="${escapeAttr(it.imageUrl || '')}" placeholder="Image URL">
    <input type="text" data-field="rate" value="${it.rate}" style="flex:0 0 80px;">
    <button class="btn-ghost" data-action="save">บันทึก</button>
    <button class="btn-ghost danger" data-action="delete">ลบ</button>
  </div>`;
}

/* ================= history ================= */
async function loadMoreHistory(main, isFirst){
  let results;
  try {
    results = await api(`/api/results?skip=${state.historySkip}&take=20`, { auth:true });
  } catch (err) {
    if (isFirst) main.innerHTML = errorBlock('โหลดประวัติไม่สำเร็จ', err.message);
    else toast('โหลดเพิ่มไม่สำเร็จ: ' + err.message, 'err');
    return;
  }
  state.historyItems = state.historyItems.concat(results);
  state.historySkip += results.length;
  renderHistoryList(main, results.length >= 20);
}

function renderHistoryList(main, hasMore){
  main.innerHTML = `
    <h1 class="section-title">ประวัติการสุ่ม</h1>
    <p class="section-sub">ผลการสุ่มกาชาทั้งหมดของบัญชีนี้</p>
    <div class="history-list">${state.historyItems.length ? state.historyItems.map(historyRowHtml).join('') : emptyState('ยังไม่มีประวัติการสุ่ม', 'ลองไปสุ่มกาชาดูที่แท็บ "สุ่มกาชา"')}</div>
    ${hasMore ? `<button class="btn-ghost" id="loadMoreBtn">โหลดเพิ่ม</button>` : ''}
  `;
  const moreBtn = document.getElementById('loadMoreBtn');
  if (moreBtn) moreBtn.addEventListener('click', () => loadMoreHistory(main, false));
  main.querySelectorAll('[data-del-result]').forEach(b => {
    b.addEventListener('click', async () => {
      const id = Number(b.dataset.delResult);
      if (!confirm('ลบประวัตินี้?')) return;
      try {
        await api(`/api/results/${id}`, { method:'DELETE', auth:true });
        state.historyItems = state.historyItems.filter(r => r.id !== id);
        toast('ลบแล้ว', 'ok');
        renderHistoryList(main, hasMore);
      } catch (err) {
        toast('ลบไม่สำเร็จ: ' + err.message, 'err');
      }
    });
  });
}

function historyRowHtml(r){
  const it = r.cardItem || {};
  const cardTitle = it.card ? it.card.title : '';
  return `<div class="history-row">
    ${it.imageUrl ? `<img src="${escapeAttr(it.imageUrl)}" alt="">` : '<div class="item-thumb-ph"></div>'}
    <div class="history-info">
      <div class="tile-title">${escapeHtml(it.name || '-')}</div>
      <div class="tile-meta">${escapeHtml(cardTitle)} · ${fmtDate(r.timestamp)}</div>
    </div>
    <button class="btn-ghost danger" data-del-result="${r.id}">ลบ</button>
  </div>`;
}

/* ================= players ================= */
async function renderPlayersView(main){
  let users;
  try {
    users = await api('/api/users?take=100', { auth:true });
  } catch (err) {
    main.innerHTML = errorBlock('โหลดผู้เล่นไม่สำเร็จ', err.message);
    return;
  }
  main.innerHTML = `
    <h1 class="section-title">ผู้เล่นทั้งหมด</h1>
    <p class="section-sub">รายชื่อผู้เล่นทั้งหมดที่ลงทะเบียนในระบบ</p>
    <div class="players-grid">${users.map(playerCardHtml).join('')}</div>
  `;
}

function playerCardHtml(u){
  const img = u.avatarUrl
    ? `<img src="${escapeAttr(u.avatarUrl)}" alt="">`
    : `<div class="avatar-ph">${escapeHtml(initials(u.username))}</div>`;
  return `<div class="player-card">
    ${img}
    <div class="tile-title">${escapeHtml(u.username)}</div>
    <div class="tile-meta">${u.isGoogle ? 'Google' : 'Email'} · เข้าร่วม ${fmtDate(u.createDate)}</div>
  </div>`;
}

/* ================= profile ================= */
async function renderProfileView(main){
  let me;
  try {
    me = await api('/api/auth/me', { auth:true });
  } catch (err) {
    main.innerHTML = errorBlock('โหลดโปรไฟล์ไม่สำเร็จ', err.message);
    return;
  }
  state.user = { ...state.user, ...me };
  persist();
  renderAuthArea();

  main.innerHTML = `
    <h1 class="section-title">โปรไฟล์</h1>
    <p class="section-sub">แก้ไขข้อมูลบัญชีของคุณ</p>
    <div class="profile-card">
      <div class="profile-head">
        ${me.avatarUrl ? `<img src="${escapeAttr(me.avatarUrl)}" alt="">` : `<div class="avatar-ph big">${escapeHtml(initials(me.username))}</div>`}
        <div>
          <div class="tile-title" style="font-size:19px;">${escapeHtml(me.username)}</div>
          <div class="tile-meta">${escapeHtml(me.email)} ${me.isGoogle ? '· Google' : ''}</div>
        </div>
      </div>
      <div class="form-grid">
        <div class="form-field"><label>Username</label><input id="p_username" value="${escapeAttr(me.username)}"></div>
        <div class="form-field"><label>Avatar URL</label><input id="p_avatar" value="${escapeAttr(me.avatarUrl || '')}"></div>
        <div class="form-field"><label>Phone No</label><input id="p_phone" value="${escapeAttr(me.phoneNo || '')}"></div>
        <div class="form-field"><label>Password ใหม่ (เว้นว่างถ้าไม่เปลี่ยน)</label><input type="password" id="p_password"></div>
      </div>
      <button class="send-btn" id="saveProfileBtn" style="background:var(--sky);">บันทึกการเปลี่ยนแปลง</button>
      <hr class="divider">
      <button class="btn-ghost danger" id="deleteAccountBtn">ลบบัญชีถาวร</button>
    </div>
  `;

  document.getElementById('saveProfileBtn').addEventListener('click', async () => {
    const body = {
      username: document.getElementById('p_username').value.trim(),
      avatarUrl: document.getElementById('p_avatar').value.trim(),
      phoneNo: document.getElementById('p_phone').value.trim(),
    };
    const pw = document.getElementById('p_password').value;
    if (pw) body.password = pw;
    try {
      const updated = await api(`/api/users/${me.id}`, { method:'PUT', auth:true, body });
      state.user = { ...state.user, ...updated };
      persist();
      renderAuthArea();
      toast('บันทึกโปรไฟล์แล้ว', 'ok');
      navigate('profile');
    } catch (err) {
      toast('บันทึกไม่สำเร็จ: ' + err.message, 'err');
    }
  });

  document.getElementById('deleteAccountBtn').addEventListener('click', async () => {
    if (!confirm('ลบบัญชีถาวร? การกระทำนี้ย้อนกลับไม่ได้')) return;
    try {
      await api(`/api/users/${me.id}`, { method:'DELETE', auth:true });
      toast('ลบบัญชีแล้ว', 'ok');
      logout();
    } catch (err) {
      toast('ลบไม่สำเร็จ: ' + err.message, 'err');
    }
  });
}

function init(){
  renderAuthArea();
  renderSidebar();
  renderMain();
  document.getElementById('settingsBtn').addEventListener('click', openSettingsModal);
}
init();
