version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gacha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gacha_password}
      POSTGRES_DB: ${POSTGRES_DB:-gacha_addict}
    ports:
      - "5433:5432"
    volumes:
      - gacha_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gacha} -d ${POSTGRES_DB:-gacha_addict}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gacha}:${POSTGRES_PASSWORD:-gacha_password}@db:5432/${POSTGRES_DB:-gacha_addict}?schema=public
    ports:
      - "3000:3000"
    volumes:
      - ./firebase-admin-sdk.json:/app/firebase-admin-sdk.json:ro
      - ./uploads:/app/uploads

volumes:
  gacha_pg_data: